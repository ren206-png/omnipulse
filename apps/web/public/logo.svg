<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" fill="none">
  <!-- Background: transparent (dark mode friendly) -->

  <!-- Pulse circle ring (partial, opening at top-right) -->
  <circle cx="50" cy="50" r="38" stroke="url(#ringGrad)" stroke-width="3" stroke-linecap="round"
    stroke-dasharray="210 30" stroke-dashoffset="-10" fill="none"/>

  <!-- ECG / pulse wave path inside circle -->
  <polyline
    points="16,50 24,50 29,35 34,65 39,42 44,58 49,50 56,50 61,38 66,62 71,50 79,50 84,50"
    stroke="url(#pulseGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- OMNIPULSE wordmark -->
  <text x="105" y="44" font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif"
    font-size="26" font-weight="700" letter-spacing="2" fill="url(#textGrad)">OMNIPULSE</text>

  <!-- Tagline -->
  <text x="107" y="62" font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif"
    font-size="9" font-weight="400" letter-spacing="3.5" fill="url(#taglineGrad)">ONE SYSTEM. EVERY PULSE.</text>

  <defs>
    <linearGradient id="ringGrad" x1="12" y1="12" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="16" y1="50" x2="84" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="105" y1="20" x2="290" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="60%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="taglineGrad" x1="107" y1="60" x2="290" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
</svg>
