<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Dark background circle -->
  <circle cx="50" cy="50" r="48" fill="#0a0a0f"/>

  <!-- Outer ring (partial) -->
  <circle cx="50" cy="50" r="40" stroke="url(#ringGrad)" stroke-width="3" stroke-linecap="round"
    stroke-dasharray="220 32" stroke-dashoffset="-10" fill="none"/>

  <!-- ECG pulse wave -->
  <polyline
    points="14,50 22,50 28,32 34,68 40,40 46,60 50,50 58,50 64,34 70,66 76,50 84,50 88,50"
    stroke="url(#pulseGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <defs>
    <linearGradient id="ringGrad" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="14" y1="50" x2="88" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
</svg>
