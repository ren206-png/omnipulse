# Deploy Workflow for OmniPulse
#
# Triggered automatically after the CI workflow completes successfully on `main`.
#
# Required GitHub repo secrets:
#   VERCEL_TOKEN — Vercel personal access token or team token
#     → Generate at: https://vercel.com/account/settings/tokens
#     → Add at:      GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#
# Railway (API):
#   No deploy step needed here. Railway is configured to auto-deploy
#   from the `main` branch via its GitHub integration.

name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy-web:
    name: Deploy Web to Vercel
    runs-on: ubuntu-latest
    # Only deploy when CI passed
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Deploy Next.js app to Vercel production
      - name: Deploy to Vercel
        working-directory: apps/web
        run: npx vercel deploy --prod --yes --token ${{ secrets.VERCEL_TOKEN }}
