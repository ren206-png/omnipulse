# GitHub Actions CI Pipeline for OmniPulse
#
# REQUIRED STATUS CHECKS for branch protection on `main`:
#   - api-typecheck-build
#   - api-tests
#   - web-typecheck-build
#
# Optional (advisory only, continue-on-error):
#   - security-check

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # Job 1: API TypeCheck + Build
  # ─────────────────────────────────────────────
  api-typecheck-build:
    name: API – TypeCheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @omnipulse/api run build

  # ─────────────────────────────────────────────
  # Job 2: API Tests (tenant isolation gate)
  # ─────────────────────────────────────────────
  api-tests:
    name: API – Tests (incl. Tenant Isolation)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm --filter @omnipulse/api exec tsx --test src/routes/__tests__/tenantIsolation.test.ts
        env:
          # Tenant isolation tests mock Prisma — dummy values prevent env.ts from throwing
          DATABASE_URL: postgresql://x:x@localhost:5432/x
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-for-tenant-isolation-32bytes!!
          JWT_EXPIRES_IN: 7d
          NODE_ENV: test

  # ─────────────────────────────────────────────
  # Job 3: Web TypeCheck + Build
  # ─────────────────────────────────────────────
  web-typecheck-build:
    name: Web – TypeCheck & Build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web
        run: pnpm --filter @omnipulse/web run build

  # ─────────────────────────────────────────────
  # Job 4: Security Audit (advisory only)
  # ─────────────────────────────────────────────
  security-check:
    name: Security – audit
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit deployed apps (API + Web only)
        run: |
          # Audit only deployed services — exclude apps/mobile (Expo) transitive deps.
          # Mobile is not deployed and not in our production attack surface.
          # NO_FIX: vulnerabilities with no patched version available, tracked separately.
          pnpm audit --audit-level=high --json 2>/dev/null | python3 -c "
          import json, sys

          try:
              data = json.load(sys.stdin)
          except Exception:
              print('Could not parse audit JSON — skipping')
              sys.exit(0)

          # Known no-fix vulnerabilities (patched: <0.0.0): excluded until upstream publishes a fix.
          NO_FIX_SUBSTRINGS = [
              'social-media-api',  # image-size via datauri — no patched version exists
          ]

          advisories = data.get('advisories', {})
          failures = []

          for adv_id, adv in advisories.items():
              if adv.get('severity') not in ('high', 'critical'):
                  continue
              name = adv.get('module_name', adv_id)
              all_paths = [p for f in adv.get('findings', []) for p in f.get('paths', [])]
              # Exclude mobile (not deployed). Handle both pnpm v9 ('apps/mobile >') and
              # v10 ('apps__mobile>') path formats.
              deployed = [p for p in all_paths
                          if 'apps__mobile' not in p and 'apps/mobile' not in p
                          and not any(nf in p for nf in NO_FIX_SUBSTRINGS)]
              if deployed:
                  failures.append(f\"{name} ({adv['severity']}): {deployed[0]}\")

          if failures:
              print(f'\n {len(failures)} high/critical vulnerabilities in deployed apps:')
              for f in failures:
                  print(f'  - {f}')
              sys.exit(1)
          else:
              total = len([a for a in advisories.values() if a.get('severity') in ('high','critical')])
              print(f'No high/critical vulnerabilities in deployed apps ({total} only in mobile/dev deps or no-fix list)')
              sys.exit(0)
          "
