# GitHub Actions CI Pipeline for OmniPulse
#
# REQUIRED STATUS CHECKS for branch protection on `main`:
#   - api-typecheck-build
#   - api-tests
#   - web-typecheck-build
#
# Optional (advisory only, continue-on-error):
#   - security-check

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # Job 1: API TypeCheck + Build
  # ─────────────────────────────────────────────
  api-typecheck-build:
    name: API – TypeCheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @omnipulse/api run build

  # ─────────────────────────────────────────────
  # Job 2: API Tests (tenant isolation gate)
  # ─────────────────────────────────────────────
  api-tests:
    name: API – Tests (incl. Tenant Isolation)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm --filter @omnipulse/api exec tsx --test src/routes/__tests__/tenantIsolation.test.ts
        env:
          # Tenant isolation tests mock Prisma — dummy values prevent env.ts from throwing
          DATABASE_URL: postgresql://x:x@localhost:5432/x
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-for-tenant-isolation-32bytes!!
          JWT_EXPIRES_IN: 7d
          NODE_ENV: test

  # ─────────────────────────────────────────────
  # Job 3: Web TypeCheck + Build
  # ─────────────────────────────────────────────
  web-typecheck-build:
    name: Web – TypeCheck & Build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web
        run: pnpm --filter @omnipulse/web run build

  # ─────────────────────────────────────────────
  # Job 4: Security Audit (advisory only)
  # ─────────────────────────────────────────────
  security-check:
    name: Security – audit
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit
        run: pnpm audit --audit-level=high
