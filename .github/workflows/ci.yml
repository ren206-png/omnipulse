# GitHub Actions CI Pipeline for OmniPulse
#
# REQUIRED STATUS CHECKS for branch protection on `main`:
#   - api-typecheck-build
#   - api-tests
#   - web-typecheck-build
#
# Optional (advisory only, continue-on-error):
#   - security-check
#
# To configure: GitHub repo → Settings → Branches → Add rule for `main`
# → Check "Require status checks to pass before merging"
# → Search and add: api-typecheck-build, api-tests, web-typecheck-build

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # Job 1: API TypeCheck + Build
  # ─────────────────────────────────────────────
  api-typecheck-build:
    name: API – TypeCheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

  # ─────────────────────────────────────────────
  # Job 2: API Tests (runs in parallel with Job 1)
  # ─────────────────────────────────────────────
  api-tests:
    name: API – Tests (incl. Tenant Isolation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      # Uses Node built-in test runner (no test script defined in package.json).
      # tenantIsolation.test.ts is a merge gate and must remain in this job.
      - name: Run tests
        run: |
          node --test \
            src/routes/__tests__/auth.me.test.ts \
            src/routes/__tests__/content-health.test.ts \
            src/routes/__tests__/tenantIsolation.test.ts

  # ─────────────────────────────────────────────
  # Job 3: Web TypeCheck + Build
  # ─────────────────────────────────────────────
  web-typecheck-build:
    name: Web – TypeCheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    env:
      # Build-time env var required by Next.js
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

  # ─────────────────────────────────────────────
  # Job 4: Security Audit (advisory only)
  # ─────────────────────────────────────────────
  security-check:
    name: Security – npm audit
    runs-on: ubuntu-latest
    # Advisory only — does not block merges
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit API dependencies
        working-directory: apps/api
        run: npm audit --audit-level=high

      - name: Audit Web dependencies
        working-directory: apps/web
        run: npm audit --audit-level=high
