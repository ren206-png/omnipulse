# GitHub Actions CI Pipeline for OmniPulse
#
# REQUIRED STATUS CHECKS for branch protection on `main`:
#   - api-typecheck-build
#   - api-tests
#   - web-typecheck-build
#
# Optional (advisory only, continue-on-error):
#   - security-check

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # Job 1: API TypeCheck + Build
  # ─────────────────────────────────────────────
  api-typecheck-build:
    name: API – TypeCheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Build API
        working-directory: apps/api
        run: pnpm run build

  # ─────────────────────────────────────────────
  # Job 2: API Tests (tenant isolation gate)
  # ─────────────────────────────────────────────
  api-tests:
    name: API – Tests (incl. Tenant Isolation)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Run tests
        working-directory: apps/api
        run: |
          node --experimental-strip-types --test \
            src/routes/__tests__/tenantIsolation.test.ts

  # ─────────────────────────────────────────────
  # Job 3: Web TypeCheck + Build
  # ─────────────────────────────────────────────
  web-typecheck-build:
    name: Web – TypeCheck & Build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web
        working-directory: apps/web
        run: pnpm run build

  # ─────────────────────────────────────────────
  # Job 4: Security Audit (advisory only)
  # ─────────────────────────────────────────────
  security-check:
    name: Security – audit
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit
        run: pnpm audit --audit-level=high
